# Prefer a trusted project's .codex/config.toml for these local task defaults.
# `make codex` or `make codex-local` loads HYBRID_AI_MCP_TOKEN from the local vault.
# The task authorizes operator actions; the gateway still enforces validation.
approval_policy = "never"

[mcp_servers.hybrid_knowledge]
url = "http://127.0.0.1:8080/mcp"
bearer_token_env_var = "HYBRID_AI_MCP_TOKEN"
required = true
startup_timeout_sec = 20
tool_timeout_sec = 1200
default_tools_approval_mode = "approve"

# Reusable lessons stay pending for an explicit user decision.
[mcp_servers.hybrid_knowledge.tools.knowledge_candidate_decide]
approval_mode = "prompt"

# Task authorization covers locally validated domain/capability/metric definitions.
[mcp_servers.hybrid_knowledge.tools.context_definition_decide]
approval_mode = "approve"

# Relationship writes change the authoritative product graph.
[mcp_servers.hybrid_knowledge.tools.repository_relation_upsert]
approval_mode = "approve"

# Indexing reads an allowlisted local repository and writes a new SQL snapshot.
[mcp_servers.hybrid_knowledge.tools.code_repository_index]
approval_mode = "approve"
