---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: workflow_run
  version: default
  variables:
    local:
      localProject: >-
        request.principal.attr.project_ids.exists(project_id,
          project_id == "*" || project_id == request.resource.attr.project_id)
  rules:
    - name: create_workflow
      actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["controller", "development", "product_owner", "operations"]
      condition:
        match:
          expr: V.localProject

    - name: read_workflow
      actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["controller", "development", "qa", "product_owner", "operations", "cloud_reviewer"]
      condition:
        match:
          expr: V.localProject

    - name: controller_transition
      actions: ["transition"]
      effect: EFFECT_ALLOW
      roles: ["controller"]
      condition:
        match:
          expr: V.localProject

    - name: development_transition
      actions: ["transition"]
      effect: EFFECT_ALLOW
      roles: ["development"]
      condition:
        match:
          expr: >-
            V.localProject &&
            request.resource.attr.event in [
              "CLASSIFIED", "READY", "PLAN_APPROVAL_REQUESTED",
              "IMPLEMENTATION_STARTED", "IMPLEMENTATION_COMPLETED", "IMPLEMENTATION_FAILED",
              "VERIFICATION_PASSED", "VERIFICATION_FAILED", "REVISION_REQUESTED",
              "TASK_QUEUED", "TASK_ACTIVATED", "LOCAL_RESULT_RECORDED",
              "CLOUD_REVIEW_RECORDED", "LOCAL_REVISION_RECORDED",
              "VALIDATION_PASSED", "VALIDATION_FAILED", "RAG_READBACK_VERIFIED"
            ]

    - name: cloud_review_transition
      actions: ["transition"]
      effect: EFFECT_ALLOW
      roles: ["cloud_reviewer"]
      condition:
        match:
          expr: V.localProject && request.resource.attr.event == "CLOUD_REVIEW_RECORDED"

    - name: qa_coordination_transition
      actions: ["transition"]
      effect: EFFECT_ALLOW
      roles: ["qa"]
      condition:
        match:
          expr: >-
            V.localProject &&
            request.resource.attr.event in [
              "HUMAN_QA_REQUESTED", "REVISION_REQUESTED", "VALIDATION_PASSED", "VALIDATION_FAILED"
            ]

    - name: product_coordination_transition
      actions: ["transition"]
      effect: EFFECT_ALLOW
      roles: ["product_owner"]
      condition:
        match:
          expr: >-
            V.localProject &&
            request.resource.attr.event in [
              "POLICY_REJECTED", "PRODUCT_APPROVAL_REQUESTED", "PROMOTION_COMPLETED",
              "LEARNING_PROMOTED", "TASK_REJECTED",
              "CLOUD_REVIEW_APPROVED", "CLOUD_REVIEW_REJECTED"
            ]

    - name: operations_cancel_transition
      actions: ["transition"]
      effect: EFFECT_ALLOW
      roles: ["operations"]
      condition:
        match:
          expr: >-
            V.localProject &&
            request.resource.attr.event in [
              "CANCEL_REQUESTED", "CANCELLED", "BLOCKED", "FAILED", "TASK_REJECTED"
            ]
