apiVersion: batch/v1
kind: Job
metadata:
  name: hybrid-ai-migrate
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: hybrid-ai
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/example/hybrid-ai-admin:0.1.0
          args: [migrate]
          envFrom:
            - configMapRef: {name: hybrid-ai-config}
            - secretRef: {name: hybrid-ai-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
