apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-ai-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: hybrid-ai-worker}
  template:
    metadata:
      labels: {app: hybrid-ai-worker}
    spec:
      serviceAccountName: hybrid-ai
      containers:
        - name: worker
          image: ghcr.io/example/hybrid-ai-worker:0.1.0
          envFrom:
            - configMapRef: {name: hybrid-ai-config}
            - secretRef: {name: hybrid-ai-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
