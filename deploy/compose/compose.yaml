name: hybrid-ai-platform

x-platform-environment: &platform-environment
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://hybrid:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/hybrid?sslmode=disable
  ARTIFACTS_PATH: /var/lib/hybrid-ai/artifacts
  OLLAMA_URL: http://ollama:11434
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
  MILVUS_ADDRESS: milvus:19530
  MILVUS_DATABASE: default
  MILVUS_COLLECTION: approved_knowledge_v1
  SEARCH_LEXICAL_FALLBACK: ${SEARCH_LEXICAL_FALLBACK:-true}
  AUTO_APPROVE_LOCAL: ${AUTO_APPROVE_LOCAL:-false}

services:
  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: hybrid
      POSTGRES_USER: hybrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybrid -d hybrid"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.21
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 30
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.6
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.32.6
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_EMBEDDING_MODEL}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  artifact-init:
    image: alpine:3.24.0
    command: ["sh", "-c", "chown -R 65532:65532 /artifacts && chmod 700 /artifacts"]
    volumes:
      - artifact-data:/artifacts
    restart: "no"

  migrate:
    build:
      context: ../..
      target: admin
    command: ["migrate"]
    environment: *platform-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  milvus-init:
    build:
      context: ../..
      target: admin
    command: ["milvus-init"]
    environment: *platform-environment
    depends_on:
      milvus:
        condition: service_healthy
    restart: "no"

  gateway:
    build:
      context: ../..
      target: gateway
    environment:
      <<: *platform-environment
      HTTP_ADDRESS: 0.0.0.0:8080
      MCP_TRANSPORT: http
      AUTH_MODE: token
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN in .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - artifact-data:/var/lib/hybrid-ai/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      milvus-init:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
      target: worker
    environment: *platform-environment
    volumes:
      - artifact-data:/var/lib/hybrid-ai/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      milvus-init:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  etcd-data:
  minio-data:
  milvus-data:
  ollama-data:
  artifact-data:
