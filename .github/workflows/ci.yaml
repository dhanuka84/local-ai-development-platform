name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd components contracts internal migrations)"
      - name: Vet
        run: go vet ./...
      - name: Unit and race tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./cmd/...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hybrid
          POSTGRES_USER: hybrid
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hybrid -d hybrid"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Promotion, quality, concurrency and recovery invariants
        env:
          TEST_DATABASE_URL: postgres://hybrid:integration-only@localhost:5432/hybrid?sslmode=disable
        run: go test -race -count=1 ./internal/postgres

  agent-ready-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Disposable PostgreSQL, AGE, Milvus, Cerbos and two-task acceptance
        run: make agent-ready-integration

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml config --quiet
      - name: Compile and test Cerbos policies
        run: make authz-policy-test
      - name: Validate versioned contracts and positive/negative fixtures
        run: make contracts-check
      - name: Render Kubernetes base
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - run: kustomize build deploy/kubernetes/base >/dev/null

  openclaw-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/openclaw-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/openclaw-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npx openclaw plugins build --root . --check
      - run: npx openclaw plugins validate --root .
      - name: Validate full OpenClaw example config
        working-directory: .
        run: make openclaw-config-check
      - run: npm audit --omit=dev

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [gateway, worker, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: hybrid-ai-${{ matrix.target }}:ci
